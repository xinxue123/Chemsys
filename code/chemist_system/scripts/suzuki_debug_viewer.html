<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#17283a;background:#f3f6fa;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#14283e;color:white;padding:20px 28px}header h1{font-size:22px;margin:0 0 8px}header p{margin:0;color:#c5d5e7;font-size:13px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:90vh}aside{padding:22px 18px;border-right:1px solid #d9e2ec;background:white}aside label{display:block;font-size:12px;color:#536477;margin:0 0 8px}select,input,button{font:inherit;border:1px solid #cbd7e4;border-radius:6px;padding:8px;background:white;color:inherit}select{max-width:100%;width:100%;margin-bottom:16px}button{cursor:pointer}button:hover{background:#eaf1f9}button:disabled{opacity:.4;cursor:default}.nav{display:flex;gap:7px;margin-bottom:20px}.nav button{flex:1;font-size:12px}.small{color:#65768a;font-size:12px;line-height:1.7}a{color:#245f9c}.rounds{display:flex;flex-wrap:wrap;gap:6px}.rounds button{min-width:39px;font-variant-numeric:tabular-nums}.rounds button.active{background:#245f9c;color:white}main{padding:22px 26px;min-width:0}.title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h2{font-size:20px;margin:0 0 8px}.subtitle{color:#5b6d80;font-size:13px}.tag{background:#fff0d2;border:1px solid #e9cb85;padding:7px 10px;border-radius:6px;font-size:12px;max-width:365px}.cards{display:flex;gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce4ed;border-radius:8px;padding:12px 16px;flex:1}.card span{display:block;color:#66788b;font-size:12px}.card strong{display:block;font-size:20px;margin-top:6px;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}.tabs button{border-color:#d6e0eb;font-size:13px}.tabs button.active{background:#245f9c;color:white;border-color:#245f9c}.panel{background:white;border:1px solid #dce4ed;border-radius:9px;padding:18px;min-width:0}.rule{line-height:1.7;margin-bottom:14px;color:#3f566d}.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.tools input{min-width:200px;flex:1}.tools select{width:auto;margin:0}.tools button{font-size:12px}.scroll{max-height:590px;overflow:auto;border:1px solid #dce4ed;border-radius:5px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{border-bottom:1px solid #e6ebf1;padding:9px 11px;text-align:right}th{position:sticky;top:0;background:#eaf0f7;z-index:1;font-weight:600;cursor:pointer}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}th:first-child{background:#eaf0f7;z-index:2}tr.selected td{background:#e9f6ef}tr.selected td:first-child{background:#d8efdf;font-weight:700}.truth{color:#865611;background:#fff6e7}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.pager div{display:flex;gap:8px}details{border:1px solid #dce4ed;border-radius:6px;margin:12px 0;padding:10px 12px}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 Consolas,Microsoft YaHei,monospace;background:#f4f7fa;padding:12px;border-radius:5px;max-height:520px;overflow:auto}.message{margin:12px 0;padding:12px;border-left:3px solid #3483b4;background:#edf5fb;line-height:1.8}.formula{background:#edf4fa;border-radius:6px;padding:13px;margin:12px 0;font-family:Consolas,Microsoft YaHei,monospace;line-height:1.9}.kv{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0}.kv>div{padding:9px;border-bottom:1px solid #e6ebf1;overflow-wrap:anywhere}.kv>div:nth-child(odd){color:#65768a}.empty{padding:35px;text-align:center;color:#6b7c8e}.path{font:12px/1.7 Consolas,Microsoft YaHei,monospace;word-break:break-all}.badge{color:#276948;background:#e4f3ea;border-radius:4px;padding:3px 6px;font-size:11px}h3{font-size:15px;margin:18px 0 10px}button.focus{color:#245f9c;border-color:#84abd0}.footer{margin-top:15px}@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{border-bottom:1px solid #ddd}.cards{flex-wrap:wrap}.tag{max-width:260px}.kv{grid-template-columns:160px minmax(0,1fr)}}
</style></head><body>
<header><h1>Suzuki · 每一次选择是怎样做出的</h1><p>原GP → 基础qLogEI与预算集 → 知识 / B4 / 事件刷新 → 区域偏移 → KF幅度与排序 → 实验反馈与滤波</p></header>
<div class="layout"><aside><label for="trajectory">选择轨迹（知识条件 / 方法）</label><select id="trajectory"></select>
<div class="nav"><button id="previous">← 上一轮</button><button id="next">下一轮 →</button></div><label>追加查询轮次（1–16）</label><div id="rounds" class="rounds"></div>
<p class="small">候选ID、排序、判断均来自实际选点实现。每个表保存全部4692点，分页只影响显示。</p><p class="small">真实产率为模拟器对照值，任何排序、预算和LLM请求都不读取这列。</p><button id="reload">刷新已完成轮次</button>
<div class="footer small"><a href="run.log" target="_blank">完整分阶段日志</a> · <a href="decision_summary.csv" target="_blank">实际选择汇总</a><p id="folder" class="path"></p></div></aside>
<main><div class="title"><div><h2 id="title">等待调试结果</h2><div id="subtitle" class="subtitle">运行脚本后刷新此页。</div></div><div class="tag">黄色列：模拟真实产率，仅用于对照。<br>排名变动：正数表示名次提升。</div></div>
<div class="cards"><div class="card"><span>本轮实际选择</span><strong id="chosen">—</strong></div><div class="card"><span>预算集 / 未查询</span><strong id="budget">—</strong></div><div class="card"><span>本轮使用的KF幅度α</span><strong id="alpha">—</strong></div><div class="card"><span>实际产率 / 当前最佳</span><strong id="yield">—</strong></div></div>
<div id="tabs" class="tabs"></div><section id="content" class="panel"><div class="empty">尚无轮次数据。</div></section></main></div>
<script src="rounds.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);let data=null,entry=null,tab='gp',page=0,pageSize=50,sortKey='',sortDirection=1,search='',filter='all',loading=0;
const condition={correct:'正确知识',wrong_category:'错误类别',mixed:'混合错误',assistant_initial:'助手初始建议'};
const method={G0_gate:'G0 仅预算门限',G1_gate_KF:'G1 +KF',G2_gate_KF_B4:'G2 +KF+B4',G3_gate_KF_B4_event:'G3 +KF+B4+刷新'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function clear(node){node.replaceChildren();}
function fmt(v){if(v===null||v===undefined)return '—';if(typeof v==='boolean')return v?'是':'否';if(typeof v==='number'){if(Number.isInteger(v))return String(v);return Math.abs(v)>0&&Math.abs(v)<.00001?v.toExponential(5):v.toFixed(6);}return String(v);}
function detail(parent,title,text,open=false){const d=el('details');d.open=open;d.append(el('summary',title),el('pre',text));parent.append(d);}
function msg(parent,text){parent.append(el('div',text,'message'));}
function kv(parent,items){const wrap=el('div',undefined,'kv');for(const [a,b] of items)wrap.append(el('div',a),el('div',typeof b==='string'?b:JSON.stringify(b)));parent.append(wrap);}
function rounds(){return window.DEBUG_ROUNDS||[];}
function groupKey(x){return `${x.case}/${x.regime}/${x.method}`;}
function init(keep){const old=keep||$('trajectory').value;clear($('trajectory'));const seen=new Map();for(const x of rounds())seen.set(groupKey(x),x);for(const [key,x] of seen){const o=el('option',`Case ${x.case} · ${condition[x.regime]||x.regime} · ${method[x.method]||x.method}`);o.value=key;$('trajectory').append(o);}if([...seen.keys()].includes(old))$('trajectory').value=old;const matches=rounds().filter(x=>groupKey(x)===$('trajectory').value);if(matches.length)load(entry&&matches.some(x=>x.path===entry.path)?matches.find(x=>x.path===entry.path):matches[0]);}
function load(x){entry=x;const token=++loading;const script=el('script');script.src=x.path+'?v='+Date.now();script.onerror=()=>{if(token===loading)$('content').replaceChildren(el('div','轮次仍在写入，请稍后刷新。','empty'));};document.body.append(script);renderRoundButtons();}
window.showDebugRound=function(x){if(entry&&(entry.case!==x.case||entry.regime!==x.regime||entry.method!==x.method||entry.round!==x.round))return;data=x;page=0;const stages=x.stages.map(s=>s.id);if(![...stages,'knowledge','feedback','log'].includes(tab))tab='gp';render();};
function renderRoundButtons(){clear($('rounds'));const list=rounds().filter(x=>groupKey(x)===$('trajectory').value).sort((a,b)=>a.round-b.round);for(const x of list){const b=el('button',String(x.round).padStart(2,'0'),entry&&entry.path===x.path?'active':'');b.onclick=()=>load(x);$('rounds').append(b);}const pos=list.findIndex(x=>entry&&x.path===entry.path);$('previous').disabled=pos<=0;$('next').disabled=pos<0||pos===list.length-1;$('previous').onclick=()=>load(list[pos-1]);$('next').onclick=()=>load(list[pos+1]);}
function render(){if(!data)return;$('title').textContent=`Case ${data.case} · 追加第${data.round}轮（总第${data.round+4}次实验）`;$('subtitle').textContent=`${condition[data.regime]||data.regime} / ${method[data.method]||data.method} · ${data.completed?'本轮已完成':'当前暂停 / 尚未完成'}`;$('chosen').textContent=data.selection?data.selection.candidate_id:'—';$('budget').textContent=data.base?`${data.base.eligible} / ${data.base.available}`:'—';$('alpha').textContent=fmt(data.amplitude);$('yield').textContent=data.event?`${(data.event.measurement.observed_y*100).toFixed(3)}% / ${data.incumbent_percent.toFixed(3)}%`:data.kf&&data.kf.enabled?`${(data.kf.observed_y*100).toFixed(3)}% / KF待更新`:'尚未反馈';$('folder').textContent=entry.directory;
clear($('tabs'));const list=[['gp','1 GPR'],['base','2 qLogEI / 门限'],['knowledge','3 知识 / LLM / B4'],['region','4 区域修正'],['kf','5–6 KF / 最终选择'],['feedback','7 反馈 / KF更新'],['log','本轮日志']];for(const [id,label]of list){if(!['knowledge','feedback','log'].includes(id)&&!data.stages.some(s=>s.id===id))continue;const b=el('button',label,tab===id?'active':'');b.onclick=()=>{tab=id;page=0;sortKey='';render();};$('tabs').append(b);}clear($('content'));if(tab==='knowledge')renderKnowledge();else if(tab==='feedback')renderFeedback();else if(tab==='log')$('content').append(el('pre',(data.log||[]).join('\n')));else renderTable();}
function filteredIndices(stage){const c=data.candidate_columns;if(!c)return[];let ix=c.candidate_id.map((_,i)=>i);if(search.trim()){const q=search.trim().toLowerCase();ix=ix.filter(i=>(c.candidate_id[i]+' '+c.catalyst[i]).toLowerCase().includes(q));}if(filter==='available')ix=ix.filter(i=>c.available[i]);if(filter==='eligible')ix=ix.filter(i=>c.eligible[i]);if(filter==='selected')ix=ix.filter(i=>data.selection&&c.candidate_id[i]===data.selection.candidate_id);const k=sortKey||stage.sort;const d=sortKey?sortDirection:1;ix.sort((a,b)=>{let va=c[k][a],vb=c[k][b];if(k.includes('rank')){if(va===0)va=1e12;if(vb===0)vb=1e12;}const comp=typeof va==='string'?va.localeCompare(vb):Number(va)-Number(vb);return comp*d||c.candidate_id[a].localeCompare(c.candidate_id[b]);});return ix;}
function download(stage){const c=data.candidate_columns;const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const lines=[stage.columns.map(quote).join(',')];const indices=c.candidate_id.map((_,i)=>i).sort((a,b)=>{const x=c[stage.sort][a]||1e12,y=c[stage.sort][b]||1e12;return x-y||c.candidate_id[a].localeCompare(c.candidate_id[b]);});for(const i of indices)lines.push(stage.columns.map(k=>quote(c[k][i])).join(','));const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=el('a');a.href=url;a.download=stage.file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function renderTable(){const parent=$('content'),stage=data.stages.find(s=>s.id===tab);if(!stage||!data.candidate_columns){parent.append(el('div','此阶段尚未完成。','empty'));return;}parent.append(el('h3',stage.title),el('div',stage.rule,'rule'),el('div','数值默认显示6位小数；悬停看原值。排序和CSV保留完整精度。','small'));const c=data.candidate_columns;const tools=el('div',undefined,'tools');const input=el('input');input.placeholder='查候选ID或催化剂；切换阶段保留查询';input.value=search;input.oninput=()=>{const caret=input.selectionStart;search=input.value;page=0;renderTableOnly();const q=$('candidate-search');q.focus();q.setSelectionRange(caret,caret);};input.id='candidate-search';const f=el('select');for(const [value,label] of [['all','全部候选'],['available','仅未查询'],['eligible','仅预算候选'],['selected','仅最终选中']]){const o=el('option',label);o.value=value;f.append(o);}f.value=filter;f.onchange=()=>{filter=f.value;page=0;renderTableOnly();};const focus=el('button','定位最终选中','focus');focus.onclick=()=>{search=data.selection?.candidate_id||'';filter='all';renderTableOnly();};const reset=el('button','清除筛选');reset.onclick=()=>{search='';filter='all';page=0;renderTableOnly();};const dl=el('button','下载本阶段全部4692行 CSV');dl.onclick=()=>download(stage);tools.append(input,f,focus,reset,dl);parent.append(tools);const ix=filteredIndices(stage),max=Math.max(0,Math.ceil(ix.length/pageSize)-1);page=Math.min(page,max);const scroll=el('div',undefined,'scroll'),table=el('table'),head=el('thead'),tr=el('tr');for(const k of stage.columns){const th=el('th',(data.labels[k]||k)+(sortKey===k?(sortDirection===1?' ↑':' ↓'):''),k.includes('DEBUG_ONLY')?'truth':'');th.title=k+'；点击排序';th.onclick=()=>{if(sortKey===k)sortDirection*=-1;else{sortKey=k;sortDirection=1;}page=0;renderTableOnly();};tr.append(th);}head.append(tr);table.append(head);const body=el('tbody');for(const i of ix.slice(page*pageSize,(page+1)*pageSize)){const row=el('tr',undefined,data.selection&&data.selection.candidate_id===c.candidate_id[i]?'selected':'');for(const k of stage.columns){let v=c[k][i];if(k==='reason')v=data.reason_labels[v]||v;const cell=el('td',fmt(v),k.includes('DEBUG_ONLY')?'truth':'');cell.title=String(c[k][i]);row.append(cell);}body.append(row);}table.append(body);scroll.append(table);parent.append(scroll);const pager=el('div',undefined,'pager'),buttons=el('div');const prev=el('button','上一页'),next=el('button','下一页');prev.disabled=page===0;next.disabled=page===max;prev.onclick=()=>{page--;renderTableOnly();};next.onclick=()=>{page++;renderTableOnly();};buttons.append(prev,next);pager.append(el('span',`匹配${ix.length} / ${c.candidate_id.length}行 · 第${page+1} / ${max+1}页`,'small'),buttons);parent.append(pager);}
function renderTableOnly(){clear($('content'));renderTable();}
function renderKnowledge(){const p=$('content');p.append(el('h3','当前知识、真实LLM请求和B4诊断'));if(!data.llm.called)msg(p,data.round===1?'本轮使用固定初始知识，没有重新调用LLM，因此不存在本轮发送的提示词或新响应。':'本轮沿用已有知识；事件未触发或本组不启用刷新，没有发送新请求。');else{msg(p,(data.llm.mode==='replay'?'本次为精确上下文重放；下列为原始请求和响应。':'本次为真实LLM刷新。')+' 触发：'+(data.llm.reasons||[]).join(', '));if(data.llm.plan){p.append(el('h3','LLM响应摘要'));msg(p,data.llm.plan.summary);for(const a of data.llm.plan.actions)detail(p,`${a.id} · ${a.operation} · 依据观测${a.support.join(',')}`,JSON.stringify(a,null,2));}if(!(data.llm.attempts||[]).length)for(const m of data.llm.pending_messages||[])detail(p,'请求前完整提示词 · '+m.role,m.content);for(const a of data.llm.attempts||[]){p.append(el('h3',a.attempt+(a.attempt==='attempt'+String(data.llm.accepted_attempt).padStart(2,'0')?' · 采用':'') ));for(const m of a.messages)detail(p,'完整提示词 · '+m.role,m.content);detail(p,'LLM原始响应',a.response_content);detail(p,'请求参数',JSON.stringify(a.request_parameters,null,2));}if(data.llm.error)msg(p,'刷新失败：'+data.llm.error);}
for(const phase of data.knowledge_phases){p.append(el('h3',phase.phase===1?'刷新前 / 当前知识与B4':'刷新后知识与B4'));const t=el('table'),h=el('tr');for(const x of ['知识ID','坐标','区间 / 类别集合','本轮用于注入'])h.append(el('th',x));t.append(h);for(const k of phase.knowledge.clauses){const row=el('tr');for(const v of [k.id,['时间','温度','用量','催化剂'][k.coordinate],JSON.stringify(k.coordinate===3?k.categories:k.bounds),phase.retained_ids.includes(k.id)?'是':'否'])row.append(el('td',v));t.append(row);}p.append(t);kv(p,[['confidence（固定）',phase.knowledge.confidence],['冲突类型',phase.B4.conflict_kind],['保留知识',phase.retained_ids],['撤下知识',phase.B4.revoked_ids]]);detail(p,'完整B4子集可行性检查',JSON.stringify(phase.B4,null,2));}detail(p,'本轮之前已观察的实验',JSON.stringify(data.history_before_query,null,2));}
function renderFeedback(){const p=$('content');p.append(el('h3','本轮选择、实验反馈与卡尔曼更新'));if(data.selection){const s=data.selection;kv(p,[['实际选择',s.candidate_id],['GP均值 → 区域均值 → KF均值',`${fmt(s.GP_mean_percent)} → ${fmt(s.mean_after_region_percent)} → ${fmt(s.mean_after_KF_percent)} %`],['基础 → 区域 → 最终qLogEI',`${fmt(s.base_qLogEI)} → ${fmt(s.region_unscaled_qLogEI)} → ${fmt(s.guided_qLogEI)}`],['基础损失 / 门限',`${fmt(s.base_qLogEI_loss)} ≤ ${fmt(s.budget_logEI)}`],['最终预算内排名',s.guided_rank_eligible]]);}const k=data.kf;if(!k){msg(p,'尚未进行本轮反馈或正在选点前暂停。');return;}if(!k.enabled){msg(p,'本轮未进行KF更新。');detail(p,'反馈信息',JSON.stringify(k,null,2),true);return;}
p.append(el('div','r = y − μ_GP\nH = [1, d_R(x)]\nR = σ_observation² + 0.0009\nv = r − H θ⁻\nS = H P⁻ Hᵀ + R\nK = P⁻ Hᵀ / S\nθ⁺ = θ⁻ + K v\nP⁺ = (I−KH) P⁻ (I−KH)ᵀ + R K Kᵀ','formula'));
kv(p,[['单位',k.units],['实验前μ / 实际y',`${fmt(k.GP_prequery_mu)} / ${fmt(k.observed_y)}`],['残差r',fmt(k.residual_y_minus_mu)],['状态θ⁻=[b,a]',k.theta_prior],['H',k.H],['R',fmt(k.R)],['创新v',fmt(k.innovation)],['S',fmt(k.S)],['卡尔曼增益K',k.K],[k.bank_after_native?'实际更新后θ⁺':'预览更新后θ⁺（尚未执行）',k.bank_after_native?k.bank_after_native.mean:k.theta_after_preview],['本轮已使用α',fmt(k.deployed_alpha_this_round)],['未来同区域可使用α',fmt(k.clipped_alpha_for_future_same_region)]]);msg(p,k.note);detail(p,'更新前协方差P⁻',JSON.stringify(k.P_prior,null,2));detail(p,'更新后协方差P⁺',JSON.stringify(k.bank_after_native?k.bank_after_native.covariance:k.P_after_preview,null,2));detail(p,'完整KF输入与实际输出',JSON.stringify(k,null,2));}
$('trajectory').onchange=()=>{entry=null;init($('trajectory').value);};$('reload').onclick=()=>{const s=el('script');s.src='rounds.js?v='+Date.now();s.onload=()=>init();document.body.append(s);};init();
</script></body></html>
