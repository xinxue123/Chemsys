[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemist"
version = "2.0.0"
description = "Autonomous materials chemist: protocol → audit → execution → XRD QPA → BO"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
audit = ["pymatgen", "mp-api"]
sim = ["rxn-ca", "reaction-network", "pymatgen"]
bo = ["scikit-learn"]
docs = ["matplotlib"]

[project.scripts]
chem = "chem.cli:main"

[tool.setuptools.packages.find]
include = ["chem*"]
exclude = ["tests*", "compat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
